services:
  db:
    build: ./db
    container_name: db-container
    env_file:
      - ./server/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-container
    ports:
      - "6379:6379"

  backend:
    build: ./server
    container_name: django-container
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: ./client
    container_name: react-container
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: